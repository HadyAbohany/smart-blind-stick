name: Decision policy regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  decision-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Run production policy checks and golden CSV replay
        run: sh Smart-Blind-Stick-2/android-benchmark/tools/run_decision_checks.sh
      - name: Install audio decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Decode and verify bundled Arabic decision speech
        run: python3 Smart-Blind-Stick-2/android-benchmark/tools/verify_speech_assets.py
