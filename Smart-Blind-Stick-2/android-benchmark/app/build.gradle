plugins { id 'com.android.application' }

android {
    namespace 'eg.sbs.benchmark'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'eg.sbs.benchmark'
        minSdk 31
        targetSdk 34
        versionCode 6
        versionName '0.3.1'
    }
    androidResources { noCompress += "m4a" }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}

tasks.register('checkBundledModels') {
    doLast {
        ['320', '640'].each { size ->
            def model = file("src/main/assets/yolo26n-${size}.onnx")
            if (!model.isFile() || model.length() < 1_000_000) {
                throw new GradleException("Missing YOLO26n ${size} export. See tools/export_models.py.")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkBundledModels' }

tasks.register('checkBundledSpeech') {
    doLast {
        def prefixes = new groovy.json.JsonSlurper().parse(file('src/main/assets/decision-speech.json'))
        def names = ['test', 'unavailable'] + prefixes.keySet().toList()
        (0..<80).each { id -> (0..<3).each { direction -> names.add("${id}_${direction}") } }
        names.each { name ->
            def clip = file("src/main/assets/speech/${name}.m4a")
            if (!clip.isFile() || clip.length() < 1_000) {
                throw new GradleException("Missing or empty Arabic speech asset: ${name}")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkBundledSpeech' }
