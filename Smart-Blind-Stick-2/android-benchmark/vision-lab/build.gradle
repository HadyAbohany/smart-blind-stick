plugins { id 'com.android.application' }

android {
    namespace 'eg.sbs.visionlab'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'eg.sbs.visionlab'
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName '0.4.0-lab'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                        "-DSBS_LLAMA_SOURCE=${providers.gradleProperty('llamaSource').orElse('').get()}"
                cppFlags '-std=c++17'
            }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs += ['../app/src/main/java']
            java.exclude '**/MainActivity.java', '**/BenchmarkRun.java'
            assets.srcDirs += ['../app/src/main/assets']
            res.srcDirs += ['../app/src/main/res']
        }
    }
    androidResources { noCompress += ['m4a', 'onnx', 'gguf'] }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'
    implementation 'com.google.ar:core:1.57.0'
}
